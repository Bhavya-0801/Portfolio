<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EFE8DC"/>
    </linearGradient>
    <pattern id="v-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E5DAC8" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#v-bg)"/>
  <rect width="800" height="500" fill="url(#v-grid)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="24" width="740" height="44" rx="4" fill="#FFFFFF" stroke="#B7A89A" stroke-width="1"/>
  <circle cx="54" cy="46" r="5" fill="#722F37"/>
  <circle cx="72" cy="46" r="5" fill="#B7A89A"/>
  <circle cx="90" cy="46" r="5" fill="#E8DCC6"/>
  <text x="116" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#722F37" font-weight="600">VESPERA / AUDIO-VISUAL RUNTIME v2.4</text>
  <text x="610" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5A504A">60.0 FPS • 44.1 kHz</text>

  <!-- Node 1: Oscillator / Generator -->
  <g transform="translate(50, 95)">
    <rect width="200" height="140" rx="4" fill="#FFFFFF" stroke="#B7A89A" stroke-width="1.5"/>
    <rect width="200" height="28" rx="4" fill="#E8DCC6"/>
    <text x="14" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2A2421">WAVETABLE OSC</text>
    <text x="160" y="19" font-family="'JetBrains Mono', monospace" font-size="10" fill="#722F37">[SRC]</text>
    <path d="M 20 70 Q 50 35 70 70 T 120 70 T 170 70" fill="none" stroke="#722F37" stroke-width="2.5"/>
    <text x="16" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6E645D">FREQ: 432.0 Hz</text>
    <text x="16" y="125" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6E645D">HARMONICS: 12</text>
    <circle cx="200" cy="80" r="6" fill="#722F37" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Node 2: WebGL Shader Canvas -->
  <g transform="translate(300, 95)">
    <rect width="250" height="190" rx="4" fill="#FFFFFF" stroke="#722F37" stroke-width="1.5"/>
    <rect width="250" height="28" rx="4" fill="#722F37"/>
    <text x="14" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FAF6F0">RAYMARCH DISPLACER</text>
    <text x="195" y="19" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E8DCC6">[WASM]</text>
    <rect x="15" y="40" width="220" height="110" fill="#231D1A" rx="2"/>
    <circle cx="125" cy="95" r="40" fill="none" stroke="#E8DCC6" stroke-width="1.5" opacity="0.7"/>
    <circle cx="125" cy="95" r="26" fill="none" stroke="#B7A89A" stroke-width="2" stroke-dasharray="4,3"/>
    <ellipse cx="125" cy="95" rx="55" ry="18" fill="none" stroke="#722F37" stroke-width="2"/>
    <text x="16" y="172" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6E645D">BUFFER: 2048x1080 (32-bit HDR)</text>
    <circle cx="0" cy="80" r="6" fill="#722F37" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="250" cy="120" r="6" fill="#722F37" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Node 3: Filter & Spatial Reverb -->
  <g transform="translate(595, 150)">
    <rect width="165" height="135" rx="4" fill="#FFFFFF" stroke="#B7A89A" stroke-width="1.5"/>
    <rect width="165" height="28" rx="4" fill="#E8DCC6"/>
    <text x="12" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#2A2421">CONVOLUTION</text>
    <circle cx="0" cy="65" r="6" fill="#722F37" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 15 95 Q 40 45 150 105" fill="none" stroke="#722F37" stroke-width="2"/>
    <text x="14" y="122" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6E645D">DECAY: 2.8s • WET: 42%</text>
  </g>

  <!-- Connecting Bézier Wires -->
  <path d="M 250 175 C 275 175, 275 175, 300 175" fill="none" stroke="#722F37" stroke-width="3" stroke-linecap="round"/>
  <path d="M 550 215 C 570 215, 575 215, 595 215" fill="none" stroke="#722F37" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Timeline & Metrics Strip -->
  <g transform="translate(50, 310)">
    <rect width="710" height="155" rx="4" fill="#FFFFFF" stroke="#B7A89A" stroke-width="1"/>
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#2A2421">TIMELINE &amp; TELEMETRY STREAM</text>
    <path d="M 20 85 L 50 65 L 80 100 L 110 50 L 140 90 L 170 40 L 200 95 L 230 60 L 260 85 L 290 45 L 320 110 L 350 70 L 380 90 L 410 40 L 440 95 L 470 60 L 500 85 L 530 40 L 560 95 L 590 65 L 620 90 L 650 50 L 690 85" fill="none" stroke="#B7A89A" stroke-width="1.5"/>
    <path d="M 20 85 L 50 70 L 80 90 L 110 55 L 140 80 L 170 50 L 200 85 L 230 70 L 260 80 L 290 60 L 320 95 L 350 75 L 380 85 L 410 50 L 440 85 L 470 70 L 500 80 L 530 55 L 560 85 L 590 70 L 620 80 L 650 60 L 690 85" fill="none" stroke="#722F37" stroke-width="2"/>
    <line x1="20" y1="120" x2="690" y2="120" stroke="#E8DCC6" stroke-width="1"/>
    <text x="20" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#722F37">LATENCY: 4.2ms</text>
    <text x="210" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5A504A">MEM ALLOC: 14.8 MB</text>
    <text x="440" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5A504A">WASM MEMORY: 64 PAGES</text>
  </g>
</svg>